<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWall - Vibrant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        glass: 'rgba(255, 255, 255, 0.08)',
                        glassBorder: 'rgba(255, 255, 255, 0.1)',
                        glassHover: 'rgba(255, 255, 255, 0.12)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050510;
            color: #ffffff;
            overflow-x: hidden;
        }


        /* Background Animations */
        .blob-cont {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite alternate;
        }


        .blob-1 {
            width: 600px;
            height: 600px;
            background: #7c3aed; /* Violet */
            top: -100px;
            left: -100px;
            animation-duration: 25s;
        }


        .blob-2 {
            width: 500px;
            height: 500px;
            background: #2563eb; /* Blue */
            bottom: -100px;
            right: -100px;
            animation-duration: 30s;
        }


        .blob-3 {
            width: 300px;
            height: 300px;
            background: #db2777; /* Pink */
            bottom: 20%;
            left: 20%;
            animation-duration: 22s;
        }


        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -50px) scale(1.1); }
        }


        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(20, 20, 35, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }


        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(124, 58, 237, 0.5); /* Violet accent */
            outline: none;
        }


        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }


        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-4 selection:bg-purple-500 selection:text-white">


    <!-- Background Blobs -->
    <div class="blob-cont">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>


    <!-- Header -->
    <header class="text-center mb-10 relative z-10">
        <div class="inline-block p-1 bg-gradient-to-r from-purple-500 via-blue-500 to-pink-500 rounded-full mb-4">
            <div class="bg-black/40 backdrop-blur-sm rounded-full px-4 py-1">
                <span class="text-xs font-bold uppercase tracking-widest text-white/90">Global Feed</span>
            </div>
        </div>
        <h1 class="text-5xl md:text-6xl font-bold tracking-tight text-white mb-2 drop-shadow-lg">
            Open<span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">Wall</span>
        </h1>
        <p class="text-white/60 text-lg font-light">Share your thoughts with the universe.</p>
    </header>


    <!-- Main Content -->
    <main class="w-full max-w-xl space-y-8 relative z-10">
        
        <!-- Input Section -->
        <div class="glass-panel p-6 rounded-2xl shadow-2xl relative overflow-hidden group">
            <!-- Top gradient line -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 via-pink-500 to-blue-500 opacity-70"></div>


            <div class="flex items-center gap-3 mb-4">
                <div class="w-2 h-2 rounded-full bg-red-400"></div>
                <div class="w-2 h-2 rounded-full bg-yellow-400"></div>
                <div class="w-2 h-2 rounded-full bg-green-400"></div>
            </div>


            <input type="text" id="username-input" placeholder="Your Alias" maxlength="20"
                class="glass-input w-full rounded-lg px-4 py-3 mb-3 text-sm font-medium placeholder-white/30">
            
            <textarea id="post-input" rows="3" placeholder="What's on your mind?" maxlength="280"
                class="glass-input w-full rounded-xl px-4 py-4 text-base resize-none placeholder-white/30 mb-2"></textarea>
            
            <div class="flex justify-between items-center mt-2">
                <span id="char-count" class="text-xs font-mono text-white/40 ml-1">0/280</span>
                <button id="post-btn" class="relative overflow-hidden group bg-white text-black px-6 py-2.5 rounded-xl font-bold text-sm transition-all hover:scale-105 active:scale-95 shadow-lg shadow-purple-500/20 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span class="relative z-10 group-hover:text-purple-600 transition-colors">Publish</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-white to-gray-200 z-0"></div>
                </button>
            </div>
        </div>


        <!-- Connection Status -->
        <div id="connection-status" class="text-center text-xs font-mono text-white/30 h-4 uppercase tracking-widest"></div>


        <!-- Feed Section -->
        <div id="feed-container" class="space-y-5 pb-24">
            <!-- Loading Skeleton -->
            <div class="glass-panel p-6 rounded-2xl animate-pulse flex gap-4">
                <div class="w-12 h-12 bg-white/10 rounded-full"></div>
                <div class="flex-1 space-y-3 py-1">
                    <div class="h-3 bg-white/10 rounded w-1/3"></div>
                    <div class="h-3 bg-white/10 rounded w-2/3"></div>
                </div>
            </div>
        </div>


        <div id="empty-state" class="hidden text-center py-16">
            <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-4 border border-white/10">
                <i class="fas fa-meteor text-3xl text-white/20"></i>
            </div>
            <p class="text-white/40">The cosmos is silent. Start a conversation.</p>
        </div>


    </main>


    <!-- Footer -->
    <footer class="fixed bottom-0 w-full py-4 text-center z-10 pointer-events-none">
        <p class="text-white/20 text-xs">Designed with <i class="fas fa-heart text-pink-500/50"></i> for the web</p>
    </footer>


    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


        // --- CONFIGURATION ---
        let firebaseConfig;
        let appId;


        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
                appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            } else {
                throw new Error("No environment config found");
            }
        } catch (e) {
            console.log("Using fallback config.");
            // --- REPLACE THIS OBJECT WITH YOUR OWN FIREBASE CONFIG FOR GITHUB ---
            firebaseConfig = {
                // apiKey: "...",
                // authDomain: "...",
                // projectId: "...",
                // ...
            }; 
            appId = "vibrant-wall-app";
        }


        // Initialize
        let app, auth, db, user;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (err) {
            console.error("Firebase Init Error:", err);
            document.getElementById('connection-status').innerHTML = '<span class="text-red-500">Config Error</span>';
        }


        // UI Elements
        const postInput = document.getElementById('post-input');
        const usernameInput = document.getElementById('username-input');
        const postBtn = document.getElementById('post-btn');
        const feedContainer = document.getElementById('feed-container');
        const charCount = document.getElementById('char-count');
        const emptyState = document.getElementById('empty-state');
        const statusEl = document.getElementById('connection-status');
        let isSubmitting = false;


        // Auth
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth failed:", error);
                if (!auth.currentUser) await signInAnonymously(auth).catch(console.error);
            }
        }


        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                setupFeedListener();
                statusEl.innerHTML = '<span class="text-green-400">● LIVE</span>';
            } else {
                statusEl.innerText = "CONNECTING...";
            }
        });


        // Create Post
        async function createPost() {
            if (!user) return;
            const content = postInput.value.trim();
            const username = usernameInput.value.trim() || "Anonymous";
            
            if (!content || isSubmitting) return;


            isSubmitting = true;
            postBtn.disabled = true;
            postBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';


            try {
                const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
                await addDoc(collectionRef, {
                    content: content,
                    author: username,
                    uid: user.uid,
                    createdAt: serverTimestamp()
                });
                postInput.value = '';
                charCount.textContent = '0/280';
            } catch (error) {
                console.error("Error adding post: ", error);
                alert("Error posting.");
            } finally {
                isSubmitting = false;
                postBtn.disabled = false;
                postBtn.innerHTML = '<span class="relative z-10 group-hover:text-purple-600 transition-colors">Publish</span><div class="absolute inset-0 bg-gradient-to-r from-white to-gray-200 z-0"></div>';
            }
        }


        // Read Posts
        function setupFeedListener() {
            if (!user) return;
            const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
            
            onSnapshot(collectionRef, (snapshot) => {
                const posts = [];
                snapshot.forEach((doc) => posts.push({ id: doc.id, ...doc.data() }));
                
                // Sort by time descending
                posts.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                renderPosts(posts);
            });
        }


        // Generate a consistent gradient for a username
        function getGradient(name) {
            const colors = [
                'from-pink-500 to-rose-500',
                'from-purple-500 to-indigo-500',
                'from-blue-500 to-cyan-500',
                'from-green-400 to-emerald-600',
                'from-orange-400 to-red-500',
                'from-fuchsia-500 to-purple-600'
            ];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }


        function renderPosts(posts) {
            feedContainer.innerHTML = '';
            if (posts.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');


            posts.forEach(post => {
                const time = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just now';
                const gradient = getGradient(post.author);
                const initial = post.author.charAt(0).toUpperCase();


                const div = document.createElement('div');
                div.className = "glass-panel p-5 rounded-2xl fade-in hover:bg-white/5 transition duration-300";
                div.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="flex-shrink-0 w-10 h-10 rounded-full bg-gradient-to-br ${gradient} flex items-center justify-center text-white font-bold text-sm shadow-lg">
                            ${initial}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-baseline mb-1">
                                <h3 class="font-bold text-white text-base tracking-wide">${escapeHtml(post.author)}</h3>
                                <span class="text-xs font-mono text-white/40">${time}</span>
                            </div>
                            <p class="text-white/80 text-base leading-relaxed break-words font-light whitespace-pre-wrap">${escapeHtml(post.content)}</p>
                        </div>
                    </div>
                `;
                feedContainer.appendChild(div);
            });
        }


        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }


        // Listeners
        postBtn.addEventListener('click', createPost);
        postInput.addEventListener('input', (e) => {
            const len = e.target.value.length;
            charCount.textContent = `${len}/280`;
            postBtn.disabled = len === 0 || len > 280;
            if (len > 280) charCount.classList.add('text-red-400');
            else charCount.classList.remove('text-red-400');
        });


        initAuth();
    </script>
</body>
</html>
